# Android build, tests and release.
#  - Every push and pull request: lint, unit tests, release bundle, a check that
#    the app has no INTERNET permission, and UI tests on an emulator.
#  - Tag like v1.0.0: builds a signed bundle and, after the UI tests pass,
#    uploads it with the R8 mapping file and release notes to the Google Play
#    INTERNAL testing track. Promote it by hand in Play Console after testing.
#  - Manual run (Actions → Android → Run workflow, any branch) with
#    "Upload a test build" checked: the same upload, without a tag or a version
#    bump. versionName gets " (test <run>)".
#  Play needs a higher versionCode for every upload: CI uses
#  versionCode * 100000 + run number (see app/build.gradle.kts).
#
# Repository secrets (set them with `gh secret set NAME`, never commit them):
#   ANDROID_KEYSTORE_BASE64      upload keystore (.jks) in base64
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_PASSWORD         optional, only if the key password differs
#   PLAY_SERVICE_ACCOUNT_JSON    service account with "Release to testing tracks"
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      play_test_build:
        description: "Upload a test build to Google Play internal testing"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # build errors are posted as a comment on the commit
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      TO_PLAY: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.play_test_build == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match versionName
        if: env.IS_RELEASE == 'true'
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key and Play version
        if: env.TO_PLAY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "PLAY_RUN_NUMBER=$GITHUB_RUN_NUMBER"
            if [ "$IS_RELEASE" != "true" ]; then
              echo "VERSION_NAME_SUFFIX= (test $GITHUB_RUN_NUMBER)"
            fi
          } >> "$GITHUB_ENV"

      - name: Lint, unit tests, release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: myslnik
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:bundleRelease 2>&1 | tee build.log

      - name: No network permission
        run: |
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          [ -n "$manifest" ] || { echo "::error::Merged release manifest not found"; exit 1; }
          echo "Checking $manifest"
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' "$manifest"; then
            echo "::error::The app must not have the INTERNET permission"
            exit 1
          fi

      - name: Report build errors on the commit
        if: failure() && hashFiles('build.log') != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android build failed"
            echo
            echo '```'
            grep -E -A3 '^e: |^\* What went wrong|FAILED|Error:' build.log \
              | sed "s#file://$GITHUB_WORKSPACE/##" | head -120
            echo '```'
          } > report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@report.md

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          retention-days: 14

      - name: Keep the bundle
        if: env.TO_PLAY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

  ui-tests:
    # Thought record, SOS, lock, PDF export, database encryption and migrations.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-${{ github.run_number }}
          path: app/build/reports/androidTests/
          retention-days: 14

  play:
    # Only bundles that passed lint, unit and UI tests reach testers.
    needs: [build, ui-tests]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.play_test_build == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: distribution

      - uses: actions/download-artifact@v4
        with:
          name: play-bundle-${{ github.run_number }}
          path: bundle

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.benekapps.myslnik
          releaseFiles: bundle/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: bundle/mapping/release/mapping.txt
